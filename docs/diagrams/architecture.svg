  <path d="M693,488 V556" class="flow"/>
  <path d="M969,488 V556" class="flow"/>
  <path d="M831.0,488.0 L831.0,540.0 Q831.0,548.0 839.0,548.0 L878.0,548.0 Q886.0,548.0 886.0,556.0 L886.0,814.0 Q886.0,822.0 894.0,822.0 L912.0,822.0" class="flow"/>
  <path d="M421,676 V768" class="flow flowBoth"/>
    <path d="M501,216 V278" class="flowPath"/>
  <path d="M279,338 V400" class="flowPath"/>
  <path d="M279,488 V556" class="flowPath"/>
  <path d="M506,616 H560" class="flowPath"/>
  <path d="M711,672 V768" class="flowPath"/>
    <line x1="16" y1="980" x2="60" y2="980" stroke="#e5c11f" stroke-width="3"/>
  <text x="70" y="984" class="note">the route of one control (example: a noise slider)</text>
  <g class="hot"><rect x="390" y="971" width="28" height="18" rx="3"/></g>
  <text x="426" y="984" class="note">on that route</text>
  <g class="node"><rect x="540" y="971" width="28" height="18" rx="3"/></g>
  <text x="576" y="984" class="note">part of the app</text>
  <g class="out"><rect x="700" y="971" width="28" height="18" rx="3"/></g>
  <text x="736" y="984" class="note">outside the app</text>
  <text x="880" y="984" class="note">Each box: what it does, then <tspan class="subNote">the file it lives in</tspan>. Every function is in CODE-INDEX.md.</text>
</svg>
